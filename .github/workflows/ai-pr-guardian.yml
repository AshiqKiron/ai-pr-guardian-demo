name: 🛡️ AI-PR Guardian

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  security-scan:
    name: Security & Compliance Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          pip install pyyaml
          # Install Semgrep (free OSS version)
          pip install semgrep
      
      - name: 🔍 Run AI-PR Guardian Scanner
        id: scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          echo "Starting security scan..."
          python scripts/scan_pr.py \
            --pr-number ${{ github.event.pull_request.number }} \
            --repository ${{ github.repository }} \
            --policies .ai-guardrails/policies.yaml \
            --output scan_results.json
            
          echo "Scan complete!"
      
      - name: 📊 Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: audit-log-pr-${{ github.event.pull_request.number }}
          path: scan_results.json
          retention-days: 90
      
      - name: 💬 Post comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            // Read scan results
            let results;
            try {
              const data = fs.readFileSync('scan_results.json', 'utf8');
              results = JSON.parse(data);
            } catch (e) {
              console.log('⚠️ No scan results found, skipping comment');
              return;
            }
            
            const prNumber = context.issue.number;
            const timestamp = new Date().toISOString();
            const auditId = Date.now();
            
            if (results.violations_found === 0) {
              // ✅ Post approval comment
              const approvalComment = `## ✅ AI-PR Guardian: All Checks Passed
              
            <details>
            <summary><strong>Scan Summary</strong></summary>
            
            - **Status**: APPROVED ✓
            - **Files scanned**: ${results.files_scanned}
            - **Violations found**: 0
            - **Timestamp**: ${timestamp}
            - **Audit ID**: ${auditId}
            
            </details>
            
            ---
            *✨ This PR passed all security and compliance checks.*
            *Powered by [AI-PR Guardian](https://github.com/${context.repo.owner}/ai-pr-guardian-demo) 🔒*`;
              
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: approvalComment
              });
              
              // Create passing check
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'AI-PR Guardian Security Check',
                head_sha: context.payload.pull_request.head.sha,
                status: 'completed',
                conclusion: 'success',
                output: {
                  title: '✅ Security Check Passed',
                  summary: `Scanned ${results.files_scanned} files - No violations detected`,
                  text: 'All security and compliance checks passed successfully.'
                }
              });
              
            } else {
              // ❌ Build violation report
              let comment = `## 🚫 AI-PR Guardian: Security Violations Detected
              
            **Status**: BLOCKED ❌
            
            <details>
            <summary><strong>Scan Summary</strong></summary>
            
            - **Files scanned**: ${results.files_scanned}
            - **Violations found**: ${results.violations_found}
            - **Timestamp**: ${timestamp}
            - **Audit ID**: ${auditId}
            
            </details>
            
            ---
            
            ### 🔍 Violation Details
            
            `;
              
              // Group violations by file
              const byFile = {};
              results.violations.forEach(v => {
                if (!byFile[v.file]) byFile[v.file] = [];
                byFile[v.file].push(v);
              });
              
              for (const [file, violations] of Object.entries(byFile)) {
                comment += `#### 📄 \`${file}\`\n\n`;
                
                violations.forEach((v, i) => {
                  const severityEmoji = {
                    'critical': '🔴',
                    'high': '🟠',
                    'medium': '🟡',
                    'low': '🔵',
                    'info': '⚪'
                  }[v.severity] || '⚪';
                  
                  comment += `${i + 1}. ${severityEmoji} **${v.policy}** (${v.severity})\n`;
                  comment += `   - ${v.message}\n`;
                  
                  if (v.line) {
                    comment += `   - **Line**: ${v.line}\n`;
                  }
                  
                  if (v.recommendation) {
                    comment += `   - 💡 **Fix**: ${v.recommendation}\n`;
                  }
                  
                  if (v.matched_text) {
                    const preview = v.matched_text.length > 60 
                      ? v.matched_text.substring(0, 60) + '...' 
                      : v.matched_text;
                    comment += `   - Found: \`${preview}\`\n`;
                  }
                  
                  comment += `\n`;
                });
              }
              
              comment += `---
              
            ### 🛠️ Next Steps
            
            1. Review the violations above
            2. Fix the identified issues
            3. Push new commits to this branch
            4. The scan will run automatically
            
            **Need help?** Check our [documentation](https://github.com/${context.repo.owner}/ai-pr-guardian-demo/tree/main/docs)
            
            *Audit ID: ${auditId} | Powered by [AI-
